<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Boxing Judge</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a; color: #eee;
    font-family: 'Segoe UI', sans-serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 20px;
  }
  h1  { font-size: 1.6rem; margin-bottom: 4px; letter-spacing: 2px; }
  .sub { color: #888; font-size: 0.8rem; margin-bottom: 16px; }

  /* arena — stacks video + overlay canvas */
  .arena { position: relative; width: 640px; max-width: 100%; }
  #vid   { width: 100%; border-radius: 8px; display: block; background: #111; transform: scaleX(-1); }
  #overlay {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }

  /* label banner */
  #banner {
    position: absolute; top: 0; left: 0; right: 0;
    background: rgba(0,0,0,0.72);
    padding: 8px 14px; border-radius: 8px 8px 0 0;
    display: flex; justify-content: space-between; align-items: center;
  }
  #label { font-size: 1.3rem; font-weight: 700; letter-spacing: 1px; }
  #fps   { font-size: 0.75rem; color: #aaa; }

  /* confidence bar */
  #conf-wrap { height: 6px; background: #222; overflow: hidden; }
  #conf-bar  { height: 100%; width: 0%; transition: width 0.1s, background 0.2s; }

  /* prob table */
  #probs {
    margin-top: 12px; width: 640px; max-width: 100%;
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
  }
  .prob-row  { background: #161616; border-radius: 6px; padding: 6px 10px; }
  .prob-name { font-size: 0.72rem; color: #aaa; margin-bottom: 3px; }
  .prob-bar-wrap { background: #2a2a2a; border-radius: 4px; height: 8px; overflow: hidden; }
  .prob-bar  { height: 100%; width: 0%; border-radius: 4px; transition: width 0.12s; }
  .prob-val  { font-size: 0.7rem; color: #ccc; margin-top: 2px; text-align: right; }

  /* controls */
  #controls { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  button {
    background: #1f1f1f; border: 1px solid #333; color: #ccc;
    padding: 8px 20px; border-radius: 6px; cursor: pointer; font-size: 0.85rem;
  }
  button:hover { background: #2a2a2a; }
  #status { color: #666; font-size: 0.75rem; margin-top: 8px; text-align: center; }
</style>
</head>
<body>

<h1>🥊 BOXING JUDGE</h1>
<p class="sub">YOLO Pose · BiLSTM · Server-Side Inference</p>

<div class="arena">
  <!-- live webcam feed (CSS-mirrored for natural selfie view) -->
  <video id="vid" autoplay playsinline muted></video>
  <!-- skeleton drawn here by JS using keypoints returned from server -->
  <canvas id="overlay"></canvas>
  <div id="banner">
    <span id="label">Starting…</span>
    <span id="fps">-- fps</span>
  </div>
  <div id="conf-wrap"><div id="conf-bar"></div></div>
</div>

<div id="probs"></div>

<div id="controls">
  <button onclick="resetBuf()">🔄 Reset Buffer</button>
  <button onclick="toggleCam()">📷 Pause / Resume</button>
</div>
<p id="status">Opening camera…</p>

<!-- hidden canvas used ONLY for frame capture — not shown to user -->
<canvas id="cap" style="display:none"></canvas>

<script>
// ── class colours ──────────────────────────────────────────────────────────
const COLOURS = {
  jab_left:        '#ff6464',
  jab_right:       '#64ff64',
  hook_left:       '#ffc800',
  hook_right:      '#00c8ff',
  uppercut_left:   '#c800ff',
  uppercut_right:  '#ff9632',
  body_hook_left:  '#32ffc8',
  body_hook_right: '#c832ff',
};
const CLASSES = Object.keys(COLOURS);

// ── build prob rows ────────────────────────────────────────────────────────
const probsDiv = document.getElementById('probs');
CLASSES.forEach(cls => {
  probsDiv.innerHTML += `
    <div class="prob-row" id="row-${cls}">
      <div class="prob-name">${cls.replace(/_/g,' ')}</div>
      <div class="prob-bar-wrap"><div class="prob-bar" id="bar-${cls}" style="background:${COLOURS[cls]}"></div></div>
      <div class="prob-val" id="val-${cls}">0%</div>
    </div>`;
});

// ── DOM refs ───────────────────────────────────────────────────────────────
const vid      = document.getElementById('vid');
const overlay  = document.getElementById('overlay');
const oc       = overlay.getContext('2d');
const cap      = document.getElementById('cap');
const capCtx   = cap.getContext('2d');

// ── state ──────────────────────────────────────────────────────────────────
let running    = true;
let inflight   = false;
let lastResult = null;
let frameCount = 0, fpsTime = performance.now();
let animId     = null;

// ── COCO-17 skeleton connections ───────────────────────────────────────────
const SKEL = [
  [0,1],[0,2],[1,3],[2,4],          // head
  [5,6],[5,7],[7,9],[6,8],[8,10],   // arms
  [5,11],[6,12],[11,12],            // torso
  [11,13],[13,15],[12,14],[14,16],  // legs
];

// ── draw skeleton on overlay canvas ───────────────────────────────────────
function drawSkeleton(kp) {
  // kp: [[x_px, y_px, conf], ...]  17 points, in RAW (non-mirrored) pixel coords
  // The video is CSS-mirrored (transform:scaleX(-1)), so we mirror x here too.
  const W = overlay.width;
  const mirror = ([x, y, c]) => [W - x, y, c];

  oc.clearRect(0, 0, overlay.width, overlay.height);

  // bones
  oc.strokeStyle = '#00e676';
  oc.lineWidth   = 2.5;
  SKEL.forEach(([a, b]) => {
    const [ax, ay, ac] = mirror(kp[a]);
    const [bx, by, bc] = mirror(kp[b]);
    if (ac > 0.3 && bc > 0.3) {
      oc.beginPath();
      oc.moveTo(ax, ay);
      oc.lineTo(bx, by);
      oc.stroke();
    }
  });

  // joints
  kp.forEach(pt => {
    const [x, y, c] = mirror(pt);
    if (c > 0.3) {
      oc.beginPath();
      oc.arc(x, y, 4, 0, 2 * Math.PI);
      oc.fillStyle = '#ffeb3b';
      oc.fill();
    }
  });
}

// ── update label / bars ────────────────────────────────────────────────────
function drawOverlay(r) {
  const lbl = r.label || '';
  const isIdle = lbl === 'idle' || lbl === 'Idle'
               || lbl.startsWith('Collecting') || lbl.startsWith('collecting')
               || lbl === 'No person detected';
  const colour      = isIdle ? '#555' : (COLOURS[lbl] || '#ccc');
  const displayText = isIdle
    ? (lbl.startsWith('collect') || lbl.startsWith('Collect') ? lbl.toUpperCase() : 'IDLE')
    : lbl.replace(/_/g, ' ').toUpperCase();

  document.getElementById('label').textContent  = displayText;
  document.getElementById('label').style.color  = colour;
  const bar = document.getElementById('conf-bar');
  bar.style.width      = isIdle ? '0%' : (r.confidence * 100).toFixed(1) + '%';
  bar.style.background = colour;

  CLASSES.forEach(cls => {
    const p = (r.probabilities?.[cls] || 0) * 100;
    document.getElementById('bar-' + cls).style.width = p.toFixed(1) + '%';
    document.getElementById('val-' + cls).textContent = p.toFixed(1) + '%';
  });

  if (r.keypoints) drawSkeleton(r.keypoints);
  else oc.clearRect(0, 0, overlay.width, overlay.height);
}

// ── capture one frame → JPEG blob ─────────────────────────────────────────
function captureBlob(quality = 0.7) {
  return new Promise(resolve => {
    cap.width  = vid.videoWidth  || 640;
    cap.height = vid.videoHeight || 480;
    capCtx.drawImage(vid, 0, 0, cap.width, cap.height);
    cap.toBlob(resolve, 'image/jpeg', quality);
  });
}

// ── POST frame to /predict ─────────────────────────────────────────────────
async function sendFrame() {
  if (inflight || !running) return;
  if (!vid.videoWidth) return;          // camera not ready yet

  inflight = true;
  try {
    const blob = await captureBlob(0.75);   // ~25 KB per frame at 640×480
    const fd   = new FormData();
    fd.append('frame', blob, 'frame.jpg');

    const res = await fetch('/predict', { method: 'POST', body: fd });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    lastResult = await res.json();
    document.getElementById('status').textContent = '';

    // sync overlay canvas size to video element's rendered size
    overlay.width  = vid.videoWidth;
    overlay.height = vid.videoHeight;

    drawOverlay(lastResult);

    // FPS from server (includes YOLO + LSTM time)
    if (lastResult.fps)
      document.getElementById('fps').textContent = lastResult.fps.toFixed(0) + ' fps';
  } catch (e) {
    document.getElementById('status').textContent = 'Server error: ' + e.message;
  } finally {
    inflight = false;
  }
}

// ── inference loop — fires as fast as server can keep up ──────────────────
function loop() {
  sendFrame();
  animId = requestAnimationFrame(loop);
}

// ── camera start ───────────────────────────────────────────────────────────
async function startCam() {
  document.getElementById('status').textContent = 'Opening camera…';
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' },
    audio: false,
  });
  vid.srcObject = stream;
  await vid.play();

  // sync overlay dimensions once video metadata is known
  overlay.width  = vid.videoWidth  || 640;
  overlay.height = vid.videoHeight || 480;

  document.getElementById('status').textContent = 'Live ✓  —  stand 2–3 m from camera';
  loop();
}

function toggleCam() {
  running = !running;
  document.getElementById('status').textContent = running ? 'Resumed' : 'Paused';
}

async function resetBuf() {
  await fetch('/reset', { method: 'POST' });
  lastResult = null;
  oc.clearRect(0, 0, overlay.width, overlay.height);
  document.getElementById('label').textContent = 'Buffer reset';
  document.getElementById('conf-bar').style.width = '0%';
  CLASSES.forEach(cls => {
    document.getElementById('bar-' + cls).style.width = '0%';
    document.getElementById('val-' + cls).textContent = '0%';
  });
}

startCam().catch(e => {
  document.getElementById('status').textContent = 'Camera error: ' + e.message;
});
</script>
</body>
</html>

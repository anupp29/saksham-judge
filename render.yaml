services:
  - type: web
    name: boxing-action-inference
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: MODEL_PATH
        value: best_boxing_model.pth
      - key: POSE_MODEL_PATH
        value: yolov8n-pose.pt
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: CORS_ORIGINS
        sync: false
